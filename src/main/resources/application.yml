server:
  port: 8080

spring:
  application:
    name: springai-app
  
  # 数据库配置
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2控制台（开发环境）
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  ratelimiter:
    instances:
      chat:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0
      rag:
        limit-for-period: 3
        limit-refresh-period: 1s
        timeout-duration: 0
      function:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
  retry:
    instances:
      chat:
        max-attempts: 3
        wait-duration: 300ms
      rag:
        max-attempts: 2
        wait-duration: 500ms
      function:
        max-attempts: 3
        wait-duration: 200ms
  timelimiter:
    instances:
      chat:
        timeout-duration: 8s
      rag:
        timeout-duration: 15s
      function:
        timeout-duration: 10s

# JWT配置
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234567890}
    access-token-validity: 3600000  # 1小时
    refresh-token-validity: 604800000  # 7天

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html


